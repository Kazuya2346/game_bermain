services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tpq_arabic_app
    restart: always
    ports:
      - "8000:80"
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_DATABASE=tpq_arabic
      - DB_USERNAME=laravel_user
      - DB_PASSWORD=laravel_password
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: tpq_arabic_db
    restart: always
    environment:
      MYSQL_DATABASE: tpq_arabic
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: