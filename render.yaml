services:
  # Langkah 2: Konfigurasi Web Service (Aplikasi)
  - type: web
    name: tpq-arabic-game
    runtime: docker # Menggunakan Dockerfile Anda
    plan: free
    region: singapore
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: tpq-db
          property: host
      - key: DB_DATABASE
        fromDatabase:
          name: tpq-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: tpq-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tpq-db
          property: password

# Langkah 4: Membuat Database (MySQL)
databases:
  - name: tpq-db
    plan: free # Gunakan plan gratis jika tersedia, atau sesuaikan
    region: singapore
    databaseName: tpq_arabic
    user: laravel_user